apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: app-production
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      # Production runs three processes from the one image; staging folds queue into worker.
      containers:
        - name: web
          image: ghcr.io/example/web:v202601010101@sha256:0a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f9
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: RAILS_ENV
              value: production
        - name: worker
          image: ghcr.io/example/web:v202601010101
          imagePullPolicy: IfNotPresent
          command: ["bundle", "exec", "good_job", "start"]
        - name: queue
          image: ghcr.io/example/web:v202601010101@sha256:0a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f9
          imagePullPolicy: IfNotPresent
          command: ["bundle", "exec", "good_job", "start", "--queues=mail"]
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: app-production
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
  namespace: app-production
spec:
  parentRefs:
    - name: public
      namespace: gateway
  hostnames:
    - web.example.test
  rules:
    - backendRefs:
        - name: web
          port: 80
