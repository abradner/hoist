name: ci

# No path filters on purpose: a skipped job is not a passing job (AGENTS.md §7).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build ./...
      # -count=1 defeats the test cache; the run count in the log is the gate, not the colour.
      - run: go test -count=1 -race ./...

  lint:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  release-config:
    # .goreleaser.yaml is only otherwise exercised when a tag is pushed, which is the worst
    # moment to find it broken. A snapshot build of this platform's binary proves the config
    # and the ldflags (the artifact, not the linter — AGENTS.md §8).
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --snapshot --clean --single-target
      - run: ./dist/hoist_linux_arm64*/hoist --version

  public-safety:
    # This repo is public. Nothing that identifies a real cluster may land in it:
    # LAN addresses, internal hostnames, kube context names. Fixtures and docs use placeholders.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/public-safety.sh
      - run: ./scripts/public-safety_test.sh
